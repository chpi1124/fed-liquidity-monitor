name: 需求 / Feature
description: 新增指标、页面、视图模式或门禁能力
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 新指标/数据源
        - 新页面/视图
        - 门禁/规范
        - 视觉/交互
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 要解决的问题
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: 数据来源与口径
      description: 若涉及新指标，写明官方机构、报表编号、FRED/H.8 序列 ID、频率与单位；不要造数
    validations:
      required: false

  - type: textarea
    id: accept
    attributes:
      label: 验收标准
      description: 如何证明完成（门禁编号、快照差异、浏览器判据）
    validations:
      required: true
